[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-resume-engine"
version = "0.1.0"
description = "Autonomous multi-stage agentic engine synthesizing ATS-optimized engineering resumes and interview defense dossiers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "pdfplumber>=0.11.0",
    "python-docx>=0.8.11",
    "langgraph>=0.2.0",
    "langchain>=0.2.0"
]

[project.scripts]
resume-engine = "main:main"
